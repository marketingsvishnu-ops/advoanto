<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>360° FITNESS</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#030405;
    color:white;
    font-family:Poppins,sans-serif;
    overflow-x:hidden;
}

/* 360° BACKGROUND */

body:before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 50% 40%,rgba(0,255,200,.12),transparent 25%),
        linear-gradient(#030405,#07100e);
    z-index:-3;
}

.grid{
    position:fixed;
    inset:0;
    background-image:
        linear-gradient(rgba(0,255,200,.05) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,255,200,.05) 1px,transparent 1px);
    background-size:60px 60px;
    transform:perspective(500px) rotateX(65deg) scale(2);
    transform-origin:center bottom;
    opacity:.5;
    z-index:-2;
}

/* NAV */

nav{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    width:92%;
    max-width:1200px;
    padding:15px 22px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:50px;
    background:rgba(5,10,10,.65);
    backdrop-filter:blur(18px);
    display:flex;
    align-items:center;
    justify-content:space-between;
    z-index:100;
}

.logo{
    font-family:Orbitron,sans-serif;
    font-size:22px;
    font-weight:900;
    letter-spacing:2px;
}

.logo span{
    color:#00ffc8;
}

nav ul{
    display:flex;
    gap:28px;
    list-style:none;
}

nav a{
    color:#aaa;
    text-decoration:none;
    font-size:12px;
    transition:.3s;
}

nav a:hover{
    color:#00ffc8;
}

.join{
    padding:10px 20px;
    border-radius:30px;
    background:#00ffc8;
    color:#00100d!important;
    font-weight:700;
}

/* HERO */

.hero{
    min-height:100vh;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:100px 20px 40px;
    perspective:1200px;
}

.hero-content{
    position:relative;
    z-index:10;
}

.tag{
    display:inline-block;
    padding:8px 18px;
    border:1px solid #00ffc8;
    color:#00ffc8;
    border-radius:50px;
    font-size:11px;
    letter-spacing:3px;
    margin-bottom:25px;
}

h1{
    font-family:Orbitron,sans-serif;
    font-size:clamp(55px,10vw,130px);
    line-height:.85;
    letter-spacing:-5px;
    text-shadow:
        0 0 20px rgba(0,255,200,.2),
        0 20px 50px #000;
}

h1 span{
    color:#00ffc8;
}

.hero p{
    max-width:650px;
    margin:30px auto;
    color:#9ca8a5;
    line-height:1.8;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:15px;
}

.btn{
    padding:15px 27px;
    border-radius:40px;
    text-decoration:none;
    font-size:12px;
    font-weight:700;
    transition:.3s;
}

.primary{
    background:#00ffc8;
    color:#00100d;
    box-shadow:0 0 30px rgba(0,255,200,.25);
}

.secondary{
    color:white;
    border:1px solid #444;
}

.btn:hover{
    transform:translateY(-5px);
}

/* 360 ORBIT */

.orbit{
    position:absolute;
    width:min(650px,90vw);
    height:min(650px,90vw);
    border:1px solid rgba(0,255,200,.15);
    border-radius:50%;
    transform:rotateX(65deg);
    animation:orbitSpin 15s linear infinite;
}

.orbit:nth-child(2){
    width:min(520px,75vw);
    height:min(520px,75vw);
    border-color:rgba(255,255,255,.1);
    animation-duration:20s;
    animation-direction:reverse;
}

.orbit:nth-child(3){
    width:min(400px,60vw);
    height:min(400px,60vw);
    border-color:rgba(0,255,200,.2);
    animation-duration:10s;
}

/* 3D CORE */

.core{
    position:absolute;
    width:170px;
    height:170px;
    border-radius:50%;
    background:
        radial-gradient(circle at 35% 30%,#fff 0 2%,transparent 3%),
        radial-gradient(circle,#00ffc8,#006b59 35%,#020605 70%);
    box-shadow:
        0 0 50px #00ffc8,
        0 0 150px rgba(0,255,200,.3);
    animation:coreFloat 4s ease-in-out infinite;
}

.core:before{
    content:"360°";
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    font-family:Orbitron;
    font-size:28px;
    font-weight:900;
}

.core:after{
    content:"";
    position:absolute;
    inset:-20px;
    border:2px solid #00ffc8;
    border-radius:50%;
    animation:pulse 2s infinite;
}

/* FLOATING CARDS */

.info{
    position:absolute;
    padding:18px 25px;
    background:rgba(4,12,11,.8);
    border:1px solid rgba(0,255,200,.25);
    border-radius:15px;
    backdrop-filter:blur(15px);
    text-align:left;
    box-shadow:0 15px 40px #000;
    animation:float 4s ease-in-out infinite;
}

.info strong{
    display:block;
    color:#00ffc8;
    font-family:Orbitron;
    font-size:22px;
}

.info small{
    color:#777;
}

.info.one{
    top:25%;
    left:8%;
}

.info.two{
    right:8%;
    top:30%;
    animation-delay:1s;
}

.info.three{
    left:12%;
    bottom:20%;
    animation-delay:2s;
}

/* SECTION */

section{
    padding:120px 7%;
}

.section-title{
    text-align:center;
    margin-bottom:60px;
}

.section-title small{
    color:#00ffc8;
    letter-spacing:4px;
}

.section-title h2{
    font-family:Orbitron;
    font-size:clamp(35px,6vw,70px);
    margin:15px 0;
}

.section-title p{
    color:#777;
}

/* 360 CARDS */

.cards{
    max-width:1200px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
    perspective:1000px;
}

.card{
    min-height:350px;
    padding:35px;
    border-radius:25px;
    background:linear-gradient(145deg,#101817,#050706);
    border:1px solid #1b302c;
    transition:.5s;
    transform-style:preserve-3d;
}

.card:hover{
    transform:rotateY(8deg) rotateX(5deg) translateY(-12px);
    border-color:#00ffc8;
    box-shadow:0 30px 60px rgba(0,255,200,.1);
}

.card-number{
    font-family:Orbitron;
    font-size:55px;
    color:#17221f;
}

.card h3{
    font-family:Orbitron;
    margin-top:40px;
    color:#00ffc8;
}

.card p{
    color:#777;
    font-size:13px;
    line-height:1.8;
    margin-top:15px;
}

/* 360 EXPERIENCE */

.experience{
    min-height:600px;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.room{
    width:min(800px,90vw);
    height:450px;
    position:relative;
    transform-style:preserve-3d;
    transform:rotateX(8deg) rotateY(-12deg);
    transition:transform .15s;
}

/* FLOOR */

.floor{
    position:absolute;
    width:100%;
    height:100%;
    background:
        linear-gradient(rgba(0,255,200,.08) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,255,200,.08) 1px,transparent 1px);
    background-size:45px 45px;
    transform:rotateX(70deg) translateZ(-180px);
    transform-origin:bottom;
}

/* WALL */

.wall{
    position:absolute;
    inset:0;
    background:
        linear-gradient(90deg,transparent 48%,rgba(0,255,200,.15) 50%,transparent 52%),
        #07100e;
    border:1px solid #163a33;
    transform:translateZ(-180px);
}

/* EQUIPMENT */

.machine{
    position:absolute;
    width:130px;
    height:190px;
    border:5px solid #222;
    background:#101313;
    border-radius:12px;
    box-shadow:0 20px 40px #000;
}

.machine:before{
    content:"";
    position:absolute;
    width:70px;
    height:8px;
    background:#00ffc8;
    left:25px;
    top:25px;
    box-shadow:0 100px 0 #222;
}

.machine.one{
    left:15%;
    bottom:20%;
    transform:translateZ(30px);
}

.machine.two{
    right:15%;
    bottom:20%;
    transform:translateZ(70px);
}

.bench{
    position:absolute;
    width:220px;
    height:35px;
    background:#191919;
    bottom:23%;
    left:36%;
    transform:translateZ(100px) rotateX(-8deg);
    border-radius:10px;
}

.weight{
    position:absolute;
    width:55px;
    height:55px;
    border:10px solid #00ffc8;
    border-radius:50%;
    bottom:22%;
    left:30%;
    transform:translateZ(120px);
}

/* CTA */

.cta{
    margin:40px 7% 100px;
    padding:100px 30px;
    border-radius:35px;
    text-align:center;
    border:1px solid #1a302b;
    background:radial-gradient(circle,#09251f,#050706 60%);
}
